name: Check PR health

on: [pull_request]

jobs:
  check-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v2

    - name: Enable Corepack
      run: corepack enable

    - name: Install Node
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'yarn'

    - name: Install packages
      run: yarn install --immutable
    
    - name: Check linting
      run: yarn lint
