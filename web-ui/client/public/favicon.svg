  <line x1="44" y1="50" x2="64" y2="50" stroke="#128C7E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="58" x2="66" y2="58" stroke="#128C7E" stroke-width="2.5" stroke-linecap="round"/>
</svg>
